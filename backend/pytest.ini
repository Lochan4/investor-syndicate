[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
env =
    DATABASE_URL=postgresql://postgres:postgres@localhost:5432/syndicate_test
    TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/syndicate_test
    WORKOS_CLIENT_ID=test-client-id
    WORKOS_API_KEY=test-api-key
    WORKOS_WEBHOOK_SECRET=test-webhook-secret
    REDIS_URL=redis://localhost:6379/1
