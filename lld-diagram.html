<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Investor Syndicate Platform — LLD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0D1117; overflow: hidden; font-family: 'SF Mono', 'Fira Code', monospace; }
  svg#canvas { width: 100vw; height: 100vh; cursor: grab; display: block; }
  svg#canvas.grabbing { cursor: grabbing; }
  #viewport > g, #viewport > path { transition: opacity 0.18s ease; }
  #legend {
    position: fixed; top: 16px; right: 16px;
    background: rgba(13,17,23,0.92); border: 1px solid #30363d;
    border-radius: 8px; padding: 12px 16px; color: #c9d1d9; font-size: 11px;
    min-width: 160px; backdrop-filter: blur(4px);
  }
  #legend h4 { color: #8b949e; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #legend .dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  #title {
    position: fixed; top: 16px; left: 16px;
    color: #c9d1d9; font-size: 13px; font-weight: 600;
    background: rgba(13,17,23,0.92); border: 1px solid #30363d;
    border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(4px);
    line-height: 1.5;
  }
  #title span { color: #58a6ff; font-size: 11px; font-weight: 400; display: block; }
  #controls {
    position: fixed; bottom: 16px; right: 16px;
    display: flex; gap: 6px;
  }
  #controls button {
    background: rgba(13,17,23,0.92); border: 1px solid #30363d;
    color: #c9d1d9; font-size: 14px; width: 32px; height: 32px;
    border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #controls button:hover { background: #21262d; }
</style>
</head>
<body>

<div id="title">
  Investor Syndicate Platform
  <span>Full LLD — Auth · Assets · Graph · Flow Canvas (template) · KG Traversal · No Forms</span>
</div>

<div id="legend">
  <h4>Components</h4>
  <div class="row"><div class="dot" style="background:#238636"></div>Auth / Security</div>
  <div class="row"><div class="dot" style="background:#1f6feb"></div>Frontend / Clients</div>
  <div class="row"><div class="dot" style="background:#0ea5e9"></div>FastAPI / API Layer</div>
  <div class="row"><div class="dot" style="background:#7c3aed"></div>Supabase / Postgres</div>
  <div class="row"><div class="dot" style="background:#b45309"></div>Redis / Arq Workers</div>
  <div class="row"><div class="dot" style="background:#059669"></div>Neo4j / KG</div>
  <div class="row"><div class="dot" style="background:#db61a2"></div>AI Pipeline</div>
  <div class="row"><div class="dot" style="background:#e3b341"></div>External APIs</div>
</div>

<div id="controls">
  <button id="zoomIn" title="Zoom In">+</button>
  <button id="zoomOut" title="Zoom Out">−</button>
  <button id="zoomReset" title="Reset">⊙</button>
</div>

<!-- Workers → Cell Deep Dive -->

<!-- Neo4j → Cell Deep Dive -->

<!-- Analysis Flow Canvas → Cell Deep Dive (navigation) -->

</g><!-- end viewport -->
</svg>

<script>
const svg = document.getElementById('canvas');
const vp  = document.getElementById('viewport');
let tx=0, ty=0, scale=0.7, dragging=false, startX, startY;

// Fix layering: move all top-level connector paths behind box groups
const bgRect = vp.querySelector(':scope > rect');
[...vp.querySelectorAll(':scope > path')].forEach(p => vp.insertBefore(p, bgRect.nextSibling));

// Clip each box group to its outer rect to prevent text horizontal overflow
const defs = document.querySelector('defs');
[...vp.querySelectorAll(':scope > g')].forEach((g, i) => {
  const r = g.querySelector(':scope > rect');
  if (!r || !r.getAttribute('width')) return;
  const id = `clip-g${i}`;
  const cp = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
  cp.id = id;
  const cr = r.cloneNode(false);
  cp.appendChild(cr);
  defs.appendChild(cp);
  g.setAttribute('clip-path', `url(#${id})`);
});

function applyTransform() {
  vp.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}
applyTransform();

const boxes = [...vp.querySelectorAll(':scope > g')];
const lines = [...vp.querySelectorAll(':scope > path')];

// Returns box bounds in viewport coordinate space
function boxBounds(g) {
  const t = (g.getAttribute('transform') || '').match(/translate\(([-\d.]+)[,\s]+([-\d.]+)\)/);
  const ox = t ? parseFloat(t[1]) : 0, oy = t ? parseFloat(t[2]) : 0;
  const b = g.getBBox();
  return { x: ox + b.x, y: oy + b.y, w: b.width, h: b.height };
}

// Returns start + end coords of a path's d attribute
function pathEndpoints(path) {
  const pairs = [...path.getAttribute('d').matchAll(/([-\d.]+),([-\d.]+)/g)];
  if (pairs.length < 1) return null;
  return {
    s: { x: +pairs[0][1],                  y: +pairs[0][2] },
    e: { x: +pairs[pairs.length-1][1],     y: +pairs[pairs.length-1][2] }
  };
}

function near(pt, b, pad) {
  pad = pad || 18;
  return pt.x >= b.x-pad && pt.x <= b.x+b.w+pad && pt.y >= b.y-pad && pt.y <= b.y+b.h+pad;
}

function resetAll() {
  boxes.forEach(b => b.style.opacity = '');
  lines.forEach(l => l.style.opacity = '');
}

boxes.forEach(box => {
  box.addEventListener('mouseenter', () => {
    if (dragging) return;
    const bb = boxBounds(box);

    // Lines whose start or end touches this box
    const hotLines = lines.filter(l => {
      const ep = pathEndpoints(l);
      return ep && (near(ep.s, bb) || near(ep.e, bb));
    });

    // Boxes at the other end of those lines
    const lit = new Set([box]);
    hotLines.forEach(l => {
      const ep = pathEndpoints(l);
      boxes.forEach(b => {
        if (b === box) return;
        const ob = boxBounds(b);
        if (near(ep.s, ob) || near(ep.e, ob)) lit.add(b);
      });
    });

    boxes.forEach(b => b.style.opacity = lit.has(b) ? '1' : '0.1');
    lines.forEach(l => l.style.opacity = hotLines.includes(l) ? '0.9' : '0.05');
  });
  box.addEventListener('mouseleave', resetAll);
});

svg.addEventListener('mousedown', e => {
  dragging=true; startX=e.clientX-tx; startY=e.clientY-ty;
  svg.classList.add('grabbing');
});
window.addEventListener('mousemove', e => {
  if(!dragging) return;
  tx=e.clientX-startX; ty=e.clientY-startY; applyTransform();
});
window.addEventListener('mouseup', () => { dragging=false; svg.classList.remove('grabbing'); resetAll(); });

svg.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const r = svg.getBoundingClientRect();
  const mx = e.clientX-r.left, my = e.clientY-r.top;
  tx = mx-(mx-tx)*delta; ty = my-(my-ty)*delta; scale*=delta; applyTransform();
}, { passive: false });

let lastDist=0;
svg.addEventListener('touchstart', e => {
  if(e.touches.length===1){ dragging=true; startX=e.touches[0].clientX-tx; startY=e.touches[0].clientY-ty; }
  if(e.touches.length===2){ lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); }
},{passive:true});
svg.addEventListener('touchmove', e => {
  if(e.touches.length===1&&dragging){ tx=e.touches[0].clientX-startX; ty=e.touches[0].clientY-startY; applyTransform(); }
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    scale*=d/lastDist; lastDist=d; applyTransform();
  }
},{passive:true});
svg.addEventListener('touchend',()=>{ dragging=false; });

document.getElementById('zoomIn').onclick   = ()=>{ scale*=1.2; applyTransform(); };
document.getElementById('zoomOut').onclick  = ()=>{ scale*=0.85; applyTransform(); };
document.getElementById('zoomReset').onclick= ()=>{ tx=0; ty=0; scale=0.7; applyTransform(); };
</script>
</body>
</html>
